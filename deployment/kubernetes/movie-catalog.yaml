
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-catalog
  template:
    metadata:
      labels:
        app: movie-catalog
    spec:
      containers:
        - name: movie-catalog
          image: movie-catalog-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: catalog-storage
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: catalog-storage
          persistentVolumeClaim:
            claimName: movie-catalog-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: movie-catalog-service
spec:
  type: NodePort
  selector:
    app: movie-catalog
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      nodePort: 30081
